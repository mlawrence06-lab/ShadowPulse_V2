name: Build Extension

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get extension version
        id: get_version
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build zip
        run: |
          cd extension
          zip -r ../ShadowPulse-v${{ env.VERSION }}.zip *

      - name: Upload Artifact (Private)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPulse-v${{ env.VERSION }}
          path: ShadowPulse-v${{ env.VERSION }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ShadowPulse Release v${{ env.VERSION }}
          files: ShadowPulse-v${{ env.VERSION }}.zip
          draft: false
          prerelease: false
